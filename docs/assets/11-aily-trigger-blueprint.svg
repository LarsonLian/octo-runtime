<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Aily 多触发源到统一 Agent 执行链</title>
  <desc id="desc">Chat、Task、定时、飞书事件、Webhook 和手动触发先在云端形成 Chat Run 或 Task Run，经 Gateway WebSocket 下发本地 daemon，再通过 JSON-RPC stdio Adapter Host 调用具体 Agent，事件反向汇报并投递。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .col { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0; }
      .node-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .node-text { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .mono { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .flow-green { fill: none; stroke: #15803d; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .inferred { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="980"/>
  <text class="title" x="48" y="52">Aily 多触发源到统一 Agent 执行链</text>
  <text class="subtitle" x="48" y="82">核心判断：Auto / Webhook 是入口规则，Chat / Task 是工作模型，Run 才是统一执行单元。</text>

  <g transform="translate(1190 36)">
    <line x1="0" y1="12" x2="40" y2="12" stroke="#334155" stroke-width="2"/>
    <text class="small" x="50" y="16">本机代码 / runtime 直接证据</text>
    <line x1="0" y1="38" x2="40" y2="38" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
    <text class="small" x="50" y="42">依据接口推断的云端内部步骤</text>
  </g>

  <text class="col" x="48" y="125">1 触发入口</text>
  <text class="col" x="350" y="125">2 云端接入服务</text>
  <text class="col" x="675" y="125">3 持久工作模型</text>
  <text class="col" x="975" y="125">4 调度与传输</text>
  <text class="col" x="1250" y="125">5 本地执行节点</text>

  <!-- Chat lane -->
  <g>
    <rect x="48" y="150" width="250" height="104" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text class="node-title" x="68" y="184">Chat / IM 消息</text>
    <text class="node-text" x="68" y="210">chat invoke / send</text>
    <text class="small" x="68" y="234">交互式、多轮、同 session 串行</text>

    <rect x="350" y="150" width="265" height="104" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="node-title" x="370" y="184">BFF Aggregator</text>
    <text class="mono" x="370" y="210">CreateSession → InvokeChat</text>
    <text class="small" x="370" y="234">立即返回 message ID / run ID</text>

    <rect x="675" y="150" width="240" height="104" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text class="node-title" x="695" y="184">Chat Session</text>
    <text class="node-text" x="695" y="210">Session(type=Chat) + Run</text>
    <text class="small" x="695" y="234">历史、消息、事件流</text>
  </g>

  <!-- Task lane -->
  <g>
    <rect x="48" y="294" width="250" height="122" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <text class="node-title" x="68" y="328">Task</text>
    <text class="node-text" x="68" y="354">create / continue / dependency</text>
    <text class="small" x="68" y="378">持久异步、可重试、有状态</text>
    <text class="small" x="68" y="398">oneshot 或 continuous</text>

    <rect x="350" y="294" width="265" height="122" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text class="node-title" x="370" y="328">Task Service</text>
    <text class="mono" x="370" y="354">CreateTask / StartRun</text>
    <text class="mono" x="370" y="378">CompleteRun / FailRun</text>
    <text class="small" x="370" y="398">Run 状态由 daemon 驱动</text>

    <rect x="675" y="294" width="240" height="122" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text class="node-title" x="695" y="328">Task + Run</text>
    <text class="node-text" x="695" y="354">Task → attemptNo → Run</text>
    <text class="small" x="695" y="378">依赖、交互、评论、终态</text>
    <text class="small" x="695" y="398">长期 session 可继续</text>
  </g>

  <!-- Auto lane -->
  <g>
    <rect x="48" y="456" width="250" height="222" rx="8" fill="#ffedd5" stroke="#fdba74"/>
    <text class="node-title" x="68" y="490">Auto 触发源</text>
    <text class="node-text" x="68" y="520">① Cron / Interval / Once</text>
    <text class="node-text" x="68" y="550">② Lark Event + 条件</text>
    <text class="node-text" x="68" y="580">③ Webhook</text>
    <text class="node-text" x="68" y="610">④ Manual Run</text>
    <text class="small" x="68" y="642">Webhook 已在协议定义；本机 CLI</text>
    <text class="small" x="68" y="660">0.1.54 尚未开放 create 参数</text>

    <rect x="350" y="456" width="265" height="222" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="node-title" x="370" y="490">Autopilot Service</text>
    <text class="node-text" x="370" y="520">保存 instruction + assignee</text>
    <text class="node-text" x="370" y="550">保存 initialTrigger + notifyConfig</text>
    <text class="node-text" x="370" y="580">服务端匹配时间 / 事件 / Webhook</text>
    <text class="node-text" x="370" y="610">一次命中形成 AutoTaskRun</text>
    <text class="small" x="370" y="642">Manual 只标记 Run 来源，</text>
    <text class="small" x="370" y="660">不是长期可配置 Trigger</text>

    <rect x="675" y="456" width="240" height="222" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text class="node-title" x="695" y="490">物化 Task</text>
    <text class="node-text" x="695" y="520">AutoTaskRun.taskId</text>
    <text class="node-text" x="695" y="550">triggerKind / triggerOccurrenceId</text>
    <text class="node-text" x="695" y="580">状态沿用 Task 状态机</text>
    <line x1="700" y1="607" x2="890" y2="607" stroke="#cbd5e1"/>
    <text class="small" x="695" y="635">结论：Auto 不直接执行模型，</text>
    <text class="small" x="695" y="655">而是把命中转换成 Task 工作</text>
  </g>

  <!-- Forward arrows -->
  <path class="flow" d="M 298 202 H 350"/>
  <path class="flow" d="M 615 202 H 675"/>
  <path class="flow" d="M 298 355 H 350"/>
  <path class="flow" d="M 615 355 H 675"/>
  <path class="flow" d="M 298 567 H 350"/>
  <path class="flow inferred" d="M 615 567 H 675"/>

  <!-- Common dispatch -->
  <rect x="975" y="228" width="220" height="286" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="node-title" x="995" y="264">Gateway Dispatch</text>
  <text class="node-text" x="995" y="292">持久排队 / 选择在线 runtime</text>
  <text class="small" x="995" y="318">具体队列、lease、重试实现</text>
  <text class="small" x="995" y="338">不在本机分发包中，属于推断</text>
  <rect x="999" y="374" width="172" height="78" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="node-title" x="1019" y="406">Frontier WSS</text>
  <text class="node-text" x="1019" y="432">downlink + heartbeat</text>
  <text class="small" x="995" y="482">本机 doctor：connected</text>
  <text class="small" x="995" y="500">runtime 0.1.54 在线</text>

  <path class="flow inferred" d="M 915 202 C 945 202 945 280 975 280"/>
  <path class="flow inferred" d="M 915 355 H 975"/>
  <path class="flow inferred" d="M 915 567 C 945 567 945 458 975 458"/>

  <!-- Local runtime -->
  <rect x="1250" y="150" width="302" height="528" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text class="node-title" x="1274" y="184">本地 Runtime 节点</text>
  <text class="small" x="1274" y="208">一台机器一个常驻 aily-daemon</text>

  <rect x="1274" y="236" width="254" height="90" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text class="node-title" x="1294" y="270">aily-daemon</text>
  <text class="node-text" x="1294" y="296">接收任务、注入 runtime env</text>
  <text class="small" x="1294" y="316">管理 Run / cancel / recovery</text>

  <rect x="1274" y="356" width="254" height="112" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text class="node-title" x="1294" y="390">Adapter Host</text>
  <text class="mono" x="1294" y="416">JSON-RPC 2.0 over stdio</text>
  <text class="small" x="1294" y="440">单 Host 加载 7 个 adapters</text>
  <text class="small" x="1294" y="458">invoke ACK + event notifications</text>

  <rect x="1274" y="500" width="254" height="146" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="node-title" x="1294" y="534">Provider Adapter</text>
  <text class="node-text" x="1294" y="560">Codex app-server / Claude CLI</text>
  <text class="node-text" x="1294" y="586">CodeBuddy ACP / OpenClaw peer</text>
  <text class="small" x="1294" y="614">capability 决定 middleware</text>
  <text class="small" x="1294" y="634">而非按 adapter 名称硬编码</text>

  <path class="flow-blue" d="M 1195 413 H 1250"/>
  <path class="flow" d="M 1401 326 V 356"/>
  <path class="flow" d="M 1401 468 V 500"/>

  <!-- Event return lane -->
  <rect x="48" y="740" width="1504" height="174" rx="8" fill="#ecfdf5" stroke="#86efac"/>
  <text class="node-title" x="72" y="776">统一事件回程与交付</text>
  <text class="small" x="72" y="800">Provider 原生输出在 adapter 内转成统一事件；session / run / task 状态与用户投递分开处理。</text>

  <g>
    <rect x="82" y="826" width="238" height="58" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
    <text class="node-text" x="102" y="852">Adapter canonical events</text>
    <text class="mono" x="102" y="872">message / tool / usage / terminal</text>

    <rect x="385" y="826" width="224" height="58" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
    <text class="node-text" x="405" y="852">Daemon 状态投影</text>
    <text class="mono" x="405" y="872">Run + Session + Task</text>

    <rect x="674" y="826" width="224" height="58" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
    <text class="node-text" x="694" y="852">Gateway 事件存储</text>
    <text class="mono" x="694" y="872">seq / envelope / replay</text>

    <rect x="963" y="826" width="248" height="58" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
    <text class="node-text" x="983" y="852">工作产品呈现</text>
    <text class="mono" x="983" y="872">Chat reply / Task comment</text>

    <rect x="1276" y="826" width="238" height="58" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
    <text class="node-text" x="1296" y="852">Auto Delivery</text>
    <text class="mono" x="1296" y="872">DM / group / condition</text>
  </g>

  <path class="flow-green" d="M 320 855 H 385"/>
  <path class="flow-green" d="M 609 855 H 674"/>
  <path class="flow-green" d="M 898 855 H 963"/>
  <path class="flow-green" d="M 1211 855 H 1276"/>
  <path class="flow-green" d="M 1401 678 V 720 C 1401 730 1360 730 1360 740"/>

  <text class="small" x="48" y="952">实线：本机代码、IDL 或 runtime 状态可直接验证。虚线：根据本机接口与 downlink 状态推断，云端调度内部实现未包含在本地发行包中。</text>
</svg>
