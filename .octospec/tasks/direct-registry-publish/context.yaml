decisions:
  - 使用最新 main 的独立 worktree，不修改主工作区现有本地发布任务。
  - npm 与 GitHub Packages 指向两个不同 registry，不将 GitHub Release 附件冒充 GitHub Packages。
  - 保留稳定 tag、源码占位、完整矩阵、归档完整性和 latest 单调合同。
  - 暂存冲突保持显式失败，不调用 stage 子命令或绕过服务端扫描和审批。
