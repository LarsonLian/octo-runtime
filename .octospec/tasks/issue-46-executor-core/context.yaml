  - R3 已落实到 serve/RPC/直接宿主消费映射和真实 worker 失败退出测试；R1/R2 仍待 M5。
  - 用户最新交付决定将 M5 留作 47/51/50 的后续联验，不再作为本次 PR 关闭 46 的前置条件；不能将其写成已运行或通过。
