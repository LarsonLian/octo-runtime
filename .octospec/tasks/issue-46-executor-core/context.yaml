  - 按 CONTRIBUTING 和用户要求使用 refactor/46-executor-core，不使用 codex 前缀。
  - Core 单一执行实现；worker 与 stdio NDJSON 保留，不以包数量推导进程数量。
  - 接入以稳定性为优先，推荐 SDK 经 IPC 调用独立 ExecutorKernel，尤其是 Electron；direct 是显式可选的内嵌简易方案，由宿主管理生命周期并承担同进程故障影响。新 Kernel 仍由 47 后续实施。
  - IPC、窗口、worker 监督归 47；业务 Extra 拆分归 43；Loop 业务和二进制发布在外部项目。
  - 现有 worker 接入是阶段性证据，不代替 47 新 Kernel 联验；不等待 Go 客户端完成才抽取 Core。
  - 用户要求评估开发计划的边界、milestone 与验收；撤回以原 issue 完整性替代计划可执行性的评分口径。
  - 本地 API、原子接纳、取消和关闭按 design 的具体草案执行；主包 executor-core 子路径是本次建议，不独立发布内部包。
