decisions:
  - 正式 Runtime CLI 与正式 daemon 对同一规范化 Home 必须共享一个端点派生函数。
  - Windows 正式端点沿用 daemon 的 16 位 SHA-256 前缀格式，删除 CLI 的 8 位 FNV 派生。
  - SDK embedded 与 Playboard 属于独立生命周期和命名空间，不纳入正式端点统一。
  - 本地跨平台测试只证明确定性字符串合同；Hosted Windows 成功才证明原生 Pipe 与 cmd 链路。
  - readiness 使用总 deadline，并保留有界的最后 status 错误与 daemon stderr。
  - 不创建发行 tag，不发布 npm 或 GitHub Release。
