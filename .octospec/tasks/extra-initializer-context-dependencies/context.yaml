decisions:
  - 本次支持破坏性更新，不保留旧 Extra 接口兼容；不扩大为删除身份或配置数据的授权。
  - config 始终为 JsonObject，函数依赖通过第二阶段独立参数注入。
  - 外层同步返回初始化函数，初始化可异步，loadContexts 同时支持数组和 Promise 返回。
  - 合并为无状态纯函数，同 key 动态整项替换，保留 base 位置，新项按动态顺序追加。
  - 推荐 SDK 在 HostApp Node 组合层执行 Extra，需 M0 证实；不设计函数跨进程代理。
  - 动态结果不缓存为历史；超时操作真正 settle 前继续计入并发，不靠重载绕过挂起操作。
  - 默认 IM 人设正文为我是明略科技的Octo助理，动态 instructions 覆盖时不暗中拼接默认。
  - 新增资源初值是设计建议，尚无本轮实测；任意不合作 JS 不能承诺绝对 OOM 防护。
  - 本轮仅规划及文档核验，不修改产品代码或线上配置。
