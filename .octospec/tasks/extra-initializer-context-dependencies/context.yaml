decisions:
  - 本次支持破坏性更新，不保留旧 Extra 接口兼容；不扩大为删除身份或配置数据的授权。
  - config 始终为 JsonObject，函数依赖通过第二阶段独立参数注入。
  - 外层同步返回初始化函数，初始化可异步，loadContexts 同时支持数组和 Promise 返回。
  - 合并为无状态纯函数，同 key 动态整项替换，保留 base 位置，新项按动态顺序追加。
  - 2026-10-17 用户同意 SDK 在 HostApp Node 组合层执行 Extra，需 M0 验证实现；不设计函数跨进程代理。
  - 2026-10-17 用户同意 loader 调用并等待第二阶段初始化；config 与业务函数参数继续分开。
  - 业务函数依赖是 loadContexts；模型执行端口是 SDK 提供的既有 invoke/cancel/respondInteraction，不要求业务实现执行内核。
  - 用户对生命周期提出初步想法并要求评估；工程评估建议宿主决定通知、SDK 有界协调、Extra 自行清理，单个 unload 不关闭 daemon，不标成全部细节已获用户确认。
  - 共享 loader 已实现先 abort、5 秒清理宽限、逆序释放及失败汇总；不合作回调清理超时后保留失败实例，禁止同名重载。SDK 整体停止装配延期。
  - 用户同意不保存动态历史结果及有界在途；一万次动态加载和两个 Channel 各一万会话的强制 GC 回归已通过，不能扩大为任意业务函数的绝对 OOM 保证。
  - 动态结果不缓存为历史；超时操作真正 settle 前继续计入并发，不靠重载绕过挂起操作。
  - 默认 IM 人设正文为我是明略科技的Octo助理，动态 instructions 覆盖时不暗中拼接默认。
  - 动态加载初值 5000ms、8 个在途；协议结果上限 32 项和 64KiB，预检深度与遍历预算限制额外校验开销。任意不合作 JS 不能承诺绝对 OOM 防护。
  - 当前 CLI 三个 Extra 全部生效；SDK 接入先不修改。CLI 仍为纯 JSON，函数不跨进程传输。
  - 不自动填充已有空 Context，不修改现有身份、Home、profile 或 Bot 配置。
