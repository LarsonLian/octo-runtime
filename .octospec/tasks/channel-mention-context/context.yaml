  - packages/octo-runtime-extra-channel-gateway/src/transport/api/messages.ts
  - packages/octo-runtime-extra-channel-gateway/src/transport/api/conversations.ts
  - packages/octo-runtime-extra-channel-gateway/src/transport/channel.ts
  - packages/octo-runtime-extra-channel-gateway/src/transport/wukong.ts
  - packages/octo-runtime-extra-channel-gateway/src/transport/contexts.ts
  - packages/octo-runtime-extra-channel-gateway/src/execution/dispatcher.ts
  - packages/octo-runtime-adapter-host/src/model-input.ts
  - .octospec/tasks/channel-mention-context/protocol.md
  - .octospec/tasks/channel-mention-context/context-guidance.md
  - .octospec/tasks/channel-mention-context/first-context.example.json
  - packages/octo-runtime-extra-channel-gateway/src/transport/normalize.ts
