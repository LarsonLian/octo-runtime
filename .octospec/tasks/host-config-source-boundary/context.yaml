rules:
  - runtime-architecture
  - runtime-extras
  - runtime-channel
  - runtime-engineering
  - runtime-protocol-design
  - runtime-context-input
  - runtime-invoke-input
sources:
  - AGENTS.md
  - .octospec/index.md
  - .octospec/rules/_index.yaml
  - .octospec/rules/architecture.md
  - .octospec/rules/extras.md
  - .octospec/rules/channel-integration.md
  - .octospec/rules/engineering.md
  - .octospec/rules/protocol-design.md
