decisions:
  - 原始 JSON Schema 供业务方参考或自行编译，不增加框架编译器和强制校验。
  - 完整声明固定 module 包名；模型、配置来源与工具由业务方决定。
  - Channel 的可选 context 只描述 v3 外壳和开放 items 对象，不嵌入或引用完整协议；协议校验仍归运行时。
  - 配置字段直接内联，不使用 $ref 或 definitions 过度拆分。
