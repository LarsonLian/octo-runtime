decisions:
  - 宿主只提供模块、JSON 和业务函数，通过 SDK 核心接口管理整个 Extra，不接触内部逻辑或自建执行桥。
  - 新增通用 loadExtra 重载，函数保留在 HostApp Node 进程；现有 descriptor 和 CLI 保持 JSON 装配。
  - 模型执行沿现有 daemon 和独立 AdapterHost；不改 Codex、模型逻辑或协议版本。
  - 函数引用装配一次，数据每轮读取；函数引用或 JSON 变化仍整体卸载重载。
  - SDK 必须完成取消、交互、唯一位置、状态日志、账号代次、进程退出及清理失败边界。
  - 新专项承接此前延期 SDK 范围，不改写旧交付证据；本轮实施本地 SDK 与 daemon 自动化，第三方 App 和 demo 暂不修改。
  - loadContexts 支持同步数组和 Promise；SQLite 驱动和连接归宿主，async 包装不会消除同步查询阻塞。
  - 主要交付物为宿主 H01-H06 完整 SDK 流程，内部接线放附录，不由宿主创建 loader 或执行桥。
  - 沿现有 submodule/workspace 接入，不把 npm 新导出或分发平台计为本次缺口。
  - Buddy 和自研 Node CLI 走同一函数接口；自带 octo-runtime CLI 继续纯 JSON 静态装配。
