name: npm Publish

on:
  workflow_call:
    inputs:
      tag:
        description: 已存在的稳定版本 annotated tag（vX.Y.Z）
        required: true
        type: string
      dry_run:
        description: 仅验证发布，不上传 npm
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false
    outputs:
      sha:
        description: Tag 对应的完整 commit
        value: ${{ jobs.validate.outputs.sha }}
      version:
        description: 不带 v 前缀的发行版本
        value: ${{ jobs.validate.outputs.version }}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo '::error::Tag must be a stable version: vX.Y.Z'
            exit 1
          }
          test "$TAG" != "v0.0.0" || {
            echo '::error::v0.0.0 is reserved as the source placeholder version'
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release commit
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # checkout 在 tag 事件中可能把本地同名 tag ref 压平成目标 commit；重新读取远端 tag 对象。
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag || {
            echo '::error::Release tag must be annotated'
            exit 1
          }
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main
          TEMPLATE_VERSION=$(git show "$SHA:package.json" | jq -r .version)
          test "$TEMPLATE_VERSION" = "0.0.0" || {
            echo "::error::Source package version must remain 0.0.0 (got $TEMPLATE_VERSION)"
            exit 1
          }
          VERSION=${TAG#v}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      release_version: ${{ needs.validate.outputs.version }}
    permissions:
      contents: read

  publish:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: octo-runtime-npm-publish-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: octo-runtime-release
          path: release
      - name: Check registry version
        id: registry
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          package='@mininglamp-oss/octo-runtime'
          archive="release/mininglamp-oss-octo-runtime-$VERSION.tgz"
          test -f "$archive"
          local_integrity=$(node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            process.stdout.write("sha512-" + createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"));
          ' "$archive")
          set +e
          output=$(npm view "$package@$VERSION" dist.integrity --json 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            registry_integrity=$(printf '%s' "$output" | jq -er \
              'if type == "string" then . else error("expected registry integrity string") end')
            if [ "$registry_integrity" != "$local_integrity" ]; then
              echo "::error::$package@$VERSION exists with different tarball integrity"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$package@$VERSION already contains this verified archive; immutable npm version will not be overwritten."
          elif printf '%s' "$output" | grep -Eiq 'E404|404 Not Found|is not in this registry'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
      - name: Publish verified archive
        if: steps.registry.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ARCHIVE="./release/mininglamp-oss-octo-runtime-$VERSION.tgz"
          test -f "$ARCHIVE"
          if [ "$DRY_RUN" = true ]; then
            npm publish "$ARCHIVE" --access public --tag "release-$VERSION" --provenance --dry-run
          else
            test -n "$NODE_AUTH_TOKEN" || {
              echo "::error::NPM_TOKEN is required for a production npm publish"
              exit 1
            }
            npm publish "$ARCHIVE" --access public --tag "release-$VERSION" --provenance
          fi
      - name: Verify published registry version
        if: inputs.dry_run == false
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if [ "$(npm view @mininglamp-oss/octo-runtime@"$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Published npm version $VERSION is not visible"
          exit 1
