name: Package Publish

on:
  workflow_call:
    inputs:
      tag:
        description: 已存在的稳定版本 annotated tag（vX.Y.Z）
        required: true
        type: string
      dry_run:
        description: 仅验证发布，不上传任何 registry
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false
    outputs:
      sha:
        description: Tag 对应的完整 commit
        value: ${{ jobs.validate.outputs.sha }}
      version:
        description: 不带 v 前缀的发行版本
        value: ${{ jobs.validate.outputs.version }}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      build_time: ${{ steps.build-time.outputs.build_time }}
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo '::error::Tag must be a stable version: vX.Y.Z'
            exit 1
          }
          test "$TAG" != "v0.0.0" || {
            echo '::error::v0.0.0 is reserved as the source placeholder version'
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release commit
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # checkout 在 tag 事件中可能把本地同名 tag ref 压平成目标 commit；重新读取远端 tag 对象。
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag || {
            echo '::error::Release tag must be annotated'
            exit 1
          }
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main
          TEMPLATE_VERSION=$(git show "$SHA:package.json" | jq -r .version)
          test "$TEMPLATE_VERSION" = "0.0.0" || {
            echo "::error::Source package version must remain 0.0.0 (got $TEMPLATE_VERSION)"
            exit 1
          }
          VERSION=${TAG#v}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Resolve immutable build timestamp
        id: build-time
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: node scripts/resolve-release-build-time.mjs "$VERSION" "$SHA"

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      release_version: ${{ needs.validate.outputs.version }}
      build_time: ${{ needs.validate.outputs.build_time }}
    permissions:
      contents: read

  publish:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: npm
            url: https://registry.npmjs.org
            provenance: "true"
          - registry: github-packages
            url: https://npm.pkg.github.com
            provenance: "false"
    concurrency:
      group: octo-runtime-package-publish-${{ matrix.registry }}-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ matrix.registry == 'github-packages' && github.token || secrets.NPM_TOKEN }}
      REGISTRY: ${{ matrix.url }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: ${{ matrix.url }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: octo-runtime-release
          path: release
      - name: Check registry version
        id: registry
        run: |
          set -euo pipefail
          node scripts/check-release-registry.mjs \
            "./release/mininglamp-oss-octo-runtime-$VERSION.tgz" "$VERSION" "$REGISTRY"
      - name: Publish verified archive
        if: steps.registry.outputs.exists != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PROVENANCE: ${{ matrix.provenance }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ARCHIVE="./release/mininglamp-oss-octo-runtime-$VERSION.tgz"
          test -f "$ARCHIVE"
          if [ "$DRY_RUN" = true ]; then
            npm publish "$ARCHIVE" --registry "$REGISTRY" --access public --tag "release-$VERSION" --ignore-scripts --provenance="$PROVENANCE" --dry-run
          else
            if [ "$REGISTRY" = https://registry.npmjs.org ] && [ -z "$NPM_TOKEN" ]; then
              echo "::error::NPM_TOKEN is required for a production npm publish"
              exit 1
            fi
            npm publish "$ARCHIVE" --registry "$REGISTRY" --access public --tag "release-$VERSION" --ignore-scripts --provenance="$PROVENANCE"
          fi
      - name: Verify published registry version
        if: inputs.dry_run == false
        run: |
          set -euo pipefail
          node scripts/check-release-registry.mjs \
            "./release/mininglamp-oss-octo-runtime-$VERSION.tgz" "$VERSION" "$REGISTRY" --wait
